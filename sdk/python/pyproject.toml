[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yilow-client"
version = "0.1.0"
description = "Yilow.ai Python SDK — programmatic access to every Yilow tool."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Yilow.ai" }]
keywords = ["yilow", "ai", "image", "video", "client", "sdk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.5.0",
]

[project.urls]
Homepage = "https://yilow.ai"
Repository = "https://github.com/yilow-ai/yilow"

[tool.hatch.build.targets.wheel]
packages = ["yilow"]

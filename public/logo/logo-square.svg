<?xml version="1.0" encoding="UTF-8"?>
<!--
  Yilow.ai — Square / app icon variant (1024x1024)
  ────────────────────────────────────────────────
  Dark rounded square with the wordmark centered. Use this for
  app stores, social profile pictures, favicons (large), Open Graph
  square previews.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1024 1024"
     preserveAspectRatio="xMidYMid meet"
     role="img"
     aria-label="Yilow.ai">
  <defs>
    <style type="text/css">
      @import url('https://fonts.googleapis.com/css2?family=Alexandria:wght@900&amp;display=swap');
      .yilow-wordmark {
        font-family: 'Alexandria', 'Inter', system-ui, -apple-system, 'Segoe UI', 'Arial Black', sans-serif;
        font-weight: 900;
        letter-spacing: -0.045em;
      }
    </style>
    <linearGradient id="yilow-glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#1a1a24"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </linearGradient>
  </defs>

  <!-- Rounded background — matches the site's bg-primary palette -->
  <rect width="1024" height="1024" rx="180" ry="180" fill="url(#yilow-glow)"/>

  <!-- Subtle inner glow ring (matches the brand accent shadow used everywhere) -->
  <rect x="6" y="6" width="1012" height="1012" rx="174" ry="174"
        fill="none" stroke="rgba(254, 228, 64, 0.08)" stroke-width="2"/>

  <!-- Wordmark, centred -->
  <text x="512" y="580"
        class="yilow-wordmark"
        font-size="200"
        text-anchor="middle">
    <tspan fill="#ffffff">Yilow</tspan><tspan fill="#fee440">.ai</tspan>
  </text>
</svg>
